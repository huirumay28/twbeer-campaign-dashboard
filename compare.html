<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>比較專案 · TAIWAN BEER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --green: #007A49;
  --green-deep: #00663D;
  --green-active: #298F66;
  --green-soft: #E6F3EC;
  --green-mid: #5CB88A;
  --green-pale: #F3F9F6;
  --gold: #E0B34E;
  --bg: #F1E8E1;
  --card: #FFFFFF;
  --text: #1C1C1C;
  --muted: #6F6A64;
  --faint: #9A948C;
  --line: #E4DBD2;
  --line-strong: #D4C9BE;
  --sidebar: 224px;
  --topbar: 56px;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(28,24,20,.04), 0 1px 3px rgba(28,24,20,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { color-scheme: light; }
body {
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg); color: var(--text); min-width: 1280px; line-height: 1.5;
}
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar);
  background: var(--green); color: #fff; z-index: 40;
  display: flex; flex-direction: column; padding: 24px 16px;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 24px; border-bottom: 1px solid rgba(255,255,255,.16); margin-bottom: 16px; }
.brand-mark { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.brand-word { display: flex; flex-direction: column; line-height: 1.1; gap: 2px; }
.brand-word b { font-size: 13px; letter-spacing: .12em; font-weight: 700; }
.brand-word span { font-size: 13px; letter-spacing: .18em; font-weight: 700; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: rgba(255,255,255,.88); font-size: 14px; font-weight: 500; }
.nav a:hover { background: rgba(255,255,255,.1); color: #fff; }
.nav a.active { background: var(--green-active); color: #fff; font-weight: 600; }
.shell { margin-left: var(--sidebar); min-height: 100vh; min-width: 0; overflow-x: hidden; }
.topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar); background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.topbar-title { font-size: 16px; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; white-space: nowrap; }
.demo-flag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; background: #FFF6DF; color: #8A6414; border: 1px solid #E8D7A0; font-size: 12px; font-weight: 600; }
.user { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.icon-btn { width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--green-soft); color: var(--green); }
.crumbs { padding: 16px 24px 0; font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.crumbs b { color: var(--text); font-weight: 500; }
.updated { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.updated time { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.page { padding: 16px 24px 48px; display: flex; flex-direction: column; gap: 20px; }
.btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; font-size: 13px; font-weight: 500; color: var(--text); display: inline-flex; align-items: center; justify-content: center; gap: 6px; line-height: 1; }
.btn:hover { border-color: var(--green); color: var(--green); }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-deep); color: #fff; }
.btn:focus-visible, .tile:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.page-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.page-head h1 { font-size: 20px; font-weight: 700; }
.actions { display: flex; gap: 8px; }
.stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stat {
  background: #fff; border: 1px solid rgba(228,219,210,.6); border-radius: 8px;
  box-shadow: var(--shadow); padding: 22px 24px 26px;
}
.stat .k { font-size: 13px; color: var(--muted); font-weight: 500; }
.stat .v {
  margin-top: 16px; font-size: 40px; font-weight: 700; color: var(--green);
  letter-spacing: -.03em; font-variant-numeric: tabular-nums; line-height: 1;
}
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.tile {
  display: flex; flex-direction: column; background: #fff; border-radius: var(--radius);
  box-shadow: var(--shadow); border: 1px solid rgba(228,219,210,.6); overflow: hidden;
  transition: border-color .15s, box-shadow .15s, transform .15s;
}
.tile:hover { border-color: var(--green-mid); box-shadow: 0 8px 22px rgba(0,122,73,.1); transform: translateY(-1px); }
.tile-banner {
  position: relative; aspect-ratio: 16 / 10; background: #04150d; overflow: hidden;
}
.tile-banner img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
.tile-banner.kv-poster img { object-position: center 18%; }
.status {
  position: absolute; top: 12px; right: 12px; height: 24px; padding: 0 10px;
  border-radius: 999px; font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.18);
}
.status.live { background: var(--green-soft); color: var(--green); }
.status.done { background: rgba(255,255,255,.92); color: var(--muted); }
.tile-body { padding: 18px 20px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.tile-title { font-size: 17px; font-weight: 700; line-height: 1.35; }
.tile-date { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.tile-dl { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
.tile-dl > div { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.tile-dl dt { font-size: 13px; color: var(--muted); font-weight: 500; }
.tile-dl dd { font-size: 13px; color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
.tile-dl dd.up { color: var(--green); font-size: 18px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
.tile-dl dd.up em { font-style: normal; margin-left: 6px; font-size: 13px; color: var(--muted); font-weight: 500; }
.more {
  margin-top: 6px; display: inline-flex; align-items: center; gap: 4px;
  font-size: 13px; font-weight: 600; color: var(--green);
}
.tile:hover .more { color: var(--green-deep); }
.foot-note { font-size: 11px; color: var(--faint); padding: 0 4px; }

.crumbs a { color: var(--muted); }
.crumbs a:hover { color: var(--green); }
.btn:focus-visible, .tile:focus-visible, .icon-btn:focus-visible, .chip:focus-visible, .seg button:focus-visible, .camp-pick input:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid rgba(228,219,210,.6); }
.card-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--line); gap: 16px; }
.card-h h2 { font-size: 15px; font-weight: 700; }
.card-h .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
.card-b { padding: 24px; }
.vendor-note {
  font-size: 13px; color: var(--muted); line-height: 1.65;
  padding: 12px 16px; border-radius: 8px;
  background: var(--green-pale); border: 1px solid #CDE6D8;
}
.vendor-note b { color: var(--text); font-weight: 600; }
.ctrl-grid { display: grid; grid-template-columns: 1.35fr .9fr; gap: 28px; align-items: start; }
.ctrl-k { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .04em; margin-bottom: 12px; }
.picks { display: flex; flex-direction: column; gap: 8px; }
.camp-pick {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer;
}
.camp-pick:hover { border-color: var(--green-mid); }
.camp-pick:has(input:checked) { border-color: var(--green); background: var(--green-pale); }
.camp-pick input { width: 16px; height: 16px; accent-color: var(--green); flex-shrink: 0; }
.swatch { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.camp-pick .lab { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 13px; }
.camp-pick .lab b { font-weight: 700; }
.camp-pick .lab span.name { color: var(--text); font-weight: 500; }
.status.done { background: #EDE8E2; color: #6F6A64; }
.fake-pill {
  height: 22px; padding: 0 8px; border-radius: 999px;
  background: #FFF6DF; color: #8A6414; border: 1px solid #E8D7A0;
  font-size: 11px; font-weight: 700; display: inline-flex; align-items: center;
}
.dims { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: #fff; font-size: 13px; font-weight: 500; color: var(--muted);
}
.chip:hover { border-color: var(--green); color: var(--green); }
.chip.on { background: var(--green); border-color: var(--green); color: #fff; }
.toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 16px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); }
.hint b { color: var(--text); font-weight: 600; }
.seg { display: inline-flex; background: #F6F2EE; border-radius: 8px; padding: 2px; }
.seg button { height: 28px; padding: 0 12px; border: 0; background: transparent; border-radius: 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.seg button.on { background: #fff; color: var(--green); box-shadow: var(--shadow); }
.chart-wrap { position: relative; height: 320px; }
.chart-foot {
  display: flex; align-items: flex-start; justify-content: space-between;
  margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line);
  font-size: 13px; color: var(--muted); gap: 16px; flex-wrap: wrap;
}
.chart-foot strong { color: var(--text); font-size: 15px; font-variant-numeric: tabular-nums; }
.sums { display: flex; flex-wrap: wrap; gap: 16px; }
.sum-item { display: inline-flex; align-items: baseline; gap: 6px; }
.sum-item i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.axis-note { font-size: 12px; color: var(--faint); max-width: 420px; line-height: 1.55; text-align: right; }
.legend-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.legend-row span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); font-weight: 500; }
.legend-row i { width: 10px; height: 3px; border-radius: 2px; display: inline-block; }
.mini-grid { display: grid; gap: 16px; align-items: stretch; }
.mini-grid.cols-1 { grid-template-columns: minmax(0, 1fr); }
.mini-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.mini-grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.mini {
  border: 1px solid var(--line); border-radius: 8px; padding: 16px 16px 12px;
  background: #fff; min-width: 0; display: flex; flex-direction: column; gap: 12px;
}
.mini-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.mini-h h3 { font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.donut-box { display: flex; align-items: center; gap: 16px; }
.donut-box canvas { width: 148px !important; height: 148px !important; flex-shrink: 0; }
.legend { display: flex; flex-direction: column; gap: 12px; flex: 1; min-width: 0; }
.legend li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 13px; list-style: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.legend .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
.legend .cnt { color: var(--muted); font-size: 12px; grid-column: 2; margin-top: -8px; }
.hbar { position: relative; height: 260px; }
.empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; min-height: 180px; padding: 28px 16px; gap: 6px;
  color: var(--muted); font-size: 13px; flex: 1;
}
.empty small { font-size: 11px; color: var(--faint); font-weight: 400; }
.empty.page-empty { min-height: 240px; }

.camp-pick .status, .mini .status { position: static; box-shadow: none; }
.page { gap: 16px; }

  </style>
</head>
<body>

      <div class="brand-mark">台</div>
