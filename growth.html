<!DOCTYPE html>
<!--
  主頁 mock · 廠商範圍
  本檔 = 可客製化成長曲線（growth.html），從 dashboard.html 點進去
  請勿改 index.html、tokyo.html、jiexian.html、projects.html、brief.html
-->
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>會員成長曲線 · TAIWAN BEER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --green: #007A49;
  --green-deep: #00663D;
  --green-active: #298F66;
  --green-soft: #E6F3EC;
  --green-mid: #5CB88A;
  --green-pale: #F3F9F6;
  --gold: #E0B34E;
  --bg: #F1E8E1;
  --card: #FFFFFF;
  --text: #1C1C1C;
  --muted: #6F6A64;
  --faint: #9A948C;
  --line: #E4DBD2;
  --line-strong: #D4C9BE;
  --sidebar: 224px;
  --topbar: 56px;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(28,24,20,.04), 0 1px 3px rgba(28,24,20,.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; color-scheme: light; }
body {
  font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg); color: var(--text); min-width: 1280px; line-height: 1.5;
  color-scheme: light;
}
button { font-family: inherit; cursor: pointer; }
a { color: inherit; text-decoration: none; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar);
  background: var(--green); color: #fff; z-index: 40;
  display: flex; flex-direction: column; padding: 24px 16px;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 24px; border-bottom: 1px solid rgba(255,255,255,.16); margin-bottom: 16px; }
.brand-mark { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.85); display: grid; place-items: center; font-weight: 700; font-size: 15px; }
.brand-word { display: flex; flex-direction: column; line-height: 1.1; gap: 2px; }
.brand-word b { font-size: 13px; letter-spacing: .12em; font-weight: 700; }
.brand-word span { font-size: 13px; letter-spacing: .18em; font-weight: 700; }
.nav { display: flex; flex-direction: column; gap: 4px; }
.nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: rgba(255,255,255,.88); font-size: 14px; font-weight: 500; }
.nav a:hover { background: rgba(255,255,255,.1); color: #fff; }
.nav a.active { background: var(--green-active); color: #fff; font-weight: 600; }
.shell { margin-left: var(--sidebar); min-height: 100vh; min-width: 0; overflow-x: hidden; }
.topbar { position: sticky; top: 0; z-index: 30; height: var(--topbar); background: #fff; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; }
.topbar-title { font-size: 16px; font-weight: 600; }
.topbar-right { display: flex; align-items: center; gap: 16px; flex-shrink: 0; white-space: nowrap; }
.demo-flag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; background: #FFF6DF; color: #8A6414; border: 1px solid #E8D7A0; font-size: 12px; font-weight: 600; }
.user { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.icon-btn { width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); border-radius: 8px; display: grid; place-items: center; }
.icon-btn:hover { background: var(--green-soft); color: var(--green); }
.crumbs { padding: 16px 24px 0; font-size: 12px; color: var(--muted); }
.crumbs b { color: var(--text); font-weight: 500; }
.updated { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.updated time { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
.chipbar { position: sticky; top: var(--topbar); z-index: 20; background: rgba(241,232,225,.92); backdrop-filter: blur(10px); padding: 12px 24px 8px; display: flex; gap: 8px; }
.chip { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: #fff; font-size: 13px; font-weight: 500; color: var(--muted); }
.chip:hover { border-color: var(--green); color: var(--green); }
.chip.on { background: var(--green); border-color: var(--green); color: #fff; }
.page { padding: 16px 24px 48px; display: flex; flex-direction: column; gap: 16px; }
.section { scroll-margin-top: 112px; }
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); border: 1px solid rgba(228,219,210,.6); }
.card-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--line); gap: 16px; }
.card-h h2 { font-size: 15px; font-weight: 700; }
.card-h .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 8px; }
.card-b { padding: 24px; }
.camp { display: flex; align-items: center; gap: 16px; padding: 16px 24px; }
.camp-kv {
  width: 92px; flex-shrink: 0; border-radius: 8px; overflow: hidden;
  background: #04150d; line-height: 0; box-shadow: var(--shadow);
}
.camp-kv img { display: block; width: 100%; height: auto; }
.camp-main { flex: 1; min-width: 0; }
.camp-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.camp-title { font-size: 18px; font-weight: 700; }
.status { height: 22px; padding: 0 8px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; }
.camp-meta { margin-top: 6px; display: flex; align-items: center; gap: 16px; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
.camp-meta span { display: inline-flex; align-items: center; gap: 6px; }
.plus { display: inline-flex; align-items: baseline; gap: 6px; padding: 8px 14px; border-radius: 8px; background: var(--green-pale); border: 1px solid #CDE6D8; }
.plus b { font-size: 22px; color: var(--green); font-weight: 700; line-height: 1; }
.plus em { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 500; }
.actions { display: flex; gap: 8px; }
.btn { height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: #fff; font-size: 13px; font-weight: 500; color: var(--text); display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--green); color: var(--green); }
.btn.primary { background: var(--green); border-color: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-deep); }
.btn:focus-visible, .chip:focus-visible, .kpi:focus-visible, .seg button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.kpi-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 16px; }
.kpi { text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 16px; min-width: 0; transition: border-color .15s, background .15s; }
.kpi:hover { border-color: var(--green-mid); }
.kpi.on { border-color: var(--green); background: var(--green-pale); box-shadow: inset 3px 0 0 var(--green); }
.kpi .k { font-size: 12px; color: var(--muted); font-weight: 500; line-height: 1.35; }
.kpi .v { margin-top: 8px; font-size: 26px; font-weight: 700; letter-spacing: -.02em; line-height: 1; }
.kpi.on .v { color: var(--green); }
.kpi .u { margin-top: 6px; font-size: 12px; color: var(--faint); }
.toolbar { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 0; gap: 20px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); }
.hint b { color: var(--text); font-weight: 600; }
.seg { display: inline-flex; background: #F6F2EE; border-radius: 8px; padding: 2px; }
.seg button { height: 32px; padding: 0 14px; border: 0; background: transparent; border-radius: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button.on { background: #fff; color: var(--green); box-shadow: var(--shadow); }
.chart-wrap { position: relative; height: 288px; }
.card#growth .card-b { padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 24px; }
.chart-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
.chart-foot strong { color: var(--text); font-size: 15px; }
.qual { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { height: 24px; padding: 0 10px; border-radius: 999px; background: #F6F2EE; color: var(--muted); font-size: 12px; display: inline-flex; align-items: center; gap: 6px; }
.pill b { color: var(--text); font-weight: 600; }
.grid-3 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1.15fr) minmax(0,.9fr); gap: 16px; }
.mini-h { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
.mini-h h3 { font-size: 14px; font-weight: 700; }
.total-chip { font-size: 12px; color: var(--muted); }
.total-chip b { color: var(--green); font-weight: 700; }
.donut-box { display: flex; align-items: center; gap: 16px; }
.donut-box canvas { width: 148px !important; height: 148px !important; }
.legend { display: flex; flex-direction: column; gap: 12px; flex: 1; }
.legend li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; font-size: 13px; list-style: none; }
.dot { width: 10px; height: 10px; border-radius: 50%; }
.legend .pct { font-weight: 700; }
.legend .cnt { color: var(--muted); font-size: 12px; grid-column: 2; margin-top: -8px; }
.bars { display: flex; flex-direction: column; gap: 10px; }
.bar-row { display: grid; grid-template-columns: 52px 1fr 92px; gap: 8px; align-items: center; }
.bar-row .lab { font-size: 12px; color: var(--muted); }
.track { height: 10px; background: #F3EEE8; border-radius: 999px; overflow: hidden; }
.fill { height: 100%; border-radius: 999px; background: var(--green); }
.bar-row .num { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.bar-row .num b { font-weight: 600; }
.bar-row .num em { font-style: normal; color: var(--muted); margin-left: 6px; }
.hbar { position: relative; height: 280px; }
.hbar.hours { height: 220px; }
.bubble-wrap { position: relative; height: 420px; }
.axis-note { font-size: 12px; color: var(--muted); }
.table-tools { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.search { height: 36px; width: 280px; padding: 0 12px 0 32px; border: 1px solid var(--line-strong); border-radius: 8px; font-family: inherit; font-size: 13px; color: var(--text); background: #fff url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2716%27 height=%2716%27 fill=%27none%27 stroke=%27%239A948C%27 stroke-width=%271.6%27 viewBox=%270 0 24 24%27%3E%3Ccircle cx=%2711%27 cy=%2711%27 r=%277%27/%3E%3Cpath d=%27M20 20l-3-3%27/%3E%3C/svg%3E") 10px 50% no-repeat; }
.search:focus { outline: none; border-color: var(--green); }
.table-frame { max-height: 280px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; }
table.ga { width: 100%; border-collapse: collapse; font-size: 13px; }
table.ga th, table.ga td { padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: right; }
table.ga th:first-child, table.ga td:first-child { text-align: left; }
table.ga thead th { font-size: 12px; font-weight: 600; color: var(--muted); background: #FAF7F4; user-select: none; position: sticky; top: 0; z-index: 1; }
table.ga thead th.s { cursor: pointer; }
table.ga thead th.s:hover { color: var(--green); }
table.ga thead th.active { color: var(--green); }
table.ga .totals { background: #F7F3EF; font-weight: 700; }
table.ga .totals td { border-bottom: 1px solid var(--line-strong); }
table.ga tbody tr:hover { background: #FBF9F6; }
table.ga .dim { font-weight: 500; }
table.ga .metric { font-variant-numeric: tabular-nums; font-weight: 600; }
table.ga .pct { display: block; font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.caret { font-size: 10px; margin-left: 4px; }
.foot-note { font-size: 11px; color: var(--faint); padding: 0 4px; }

.sec-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding: 0 4px; }
.sec-head h2 { font-size: 15px; font-weight: 700; }
.dd { position: relative; }
.dd-menu {
  display: none; position: absolute; right: 0; top: calc(100% + 4px); z-index: 20;
  min-width: 148px; background: #fff; border: 1px solid var(--line-strong); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(28,24,20,.12); padding: 4px;
}
.dd.open .dd-menu { display: block; }
.dd-menu button {
  display: block; width: 100%; text-align: left; border: 0; background: transparent;
  padding: 8px 12px; border-radius: 6px; font-size: 13px; font-weight: 500; color: var(--text);
}
.dd-menu button:hover { background: var(--green-pale); color: var(--green); }
.head-right { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }


.game-split { display: grid; grid-template-columns: 1.15fr .85fr; gap: 20px; padding: 24px 24px 8px; }
.funnel-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.rank-list { display: flex; flex-direction: column; }
.rank-row {
  display: grid; grid-template-columns: 28px 1fr auto; gap: 10px; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--line);
}
.rank-row:last-child { border-bottom: 0; }
.rank-row .i {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  font-size: 11px; font-weight: 700; color: var(--muted); background: #F3EEE8;
}
.rank-row:nth-child(1) .i { background: var(--green); color: #fff; }
.rank-row:nth-child(2) .i { background: #5CB88A; color: #fff; }
.rank-row:nth-child(3) .i { background: #CDE6D8; color: var(--green-deep); }
.rank-row .lab { font-size: 14px; font-weight: 700; }
.rank-row .sub { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }
.rank-row .num { font-size: 20px; font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -.03em; line-height: 1; text-align: right; }
.rank-row .share { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 3px; text-align: right; }
.game-block h3 { font-size: 14px; font-weight: 700; }
.game-block .why { font-size: 12px; color: var(--muted); margin: 4px 0 14px; }
.funnel { display: flex; flex-direction: column; }
.funnel-row { display: grid; grid-template-columns: 1fr; }
.fbar {
  height: 42px; border-radius: 6px; background: var(--green); color: #fff;
  display: flex; align-items: center; justify-content: space-between; padding: 0 12px;
  font-size: 12px; font-weight: 600; min-width: 88px;
}
.fbar .fn { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-right: 8px; }
.fbar .fv { font-variant-numeric: tabular-nums; flex-shrink: 0; }
.fdrop { font-size: 11px; color: #B45309; padding: 5px 0 5px 8px; font-weight: 600; }
.fdrop.ok { color: var(--green); }
.leak {
  margin-top: 12px; padding: 10px 12px; border-radius: 8px;
  background: #FFF6DF; border: 1px solid #E8D7A0; font-size: 12px; color: #8A6414;
}
.leak b { color: #6B4E10; }
.path-starts { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.path-starts button {
  height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-strong);
  background: #fff; font-size: 12px; font-weight: 600; color: var(--muted);
}
.path-starts button.on { background: var(--green); border-color: var(--green); color: #fff; }
.path-list { display: flex; flex-direction: column; gap: 8px; }
.path-row { display: grid; grid-template-columns: 1fr 92px; gap: 8px; align-items: center; }
.path-row .lab { font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.path-row .track { height: 10px; background: #F3EEE8; border-radius: 999px; overflow: hidden; grid-column: 1; }
.path-row .fill { height: 100%; border-radius: 999px; background: var(--green); }
.path-row.leave .fill { background: #C45C26; }
.path-row.leave .lab { color: #C45C26; }
.path-row .num { font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
.path-row .num em { font-style: normal; color: var(--muted); margin-left: 6px; }
@media (max-width: 1100px) { .game-split { grid-template-columns: 1fr; } }


.filters { display: flex; flex-direction: column; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.filter-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.range-box { margin-top: 0; }
.range-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; width: 100%; }
.date-fields { display: flex; align-items: flex-end; gap: 14px; }
.date-fields label { display: flex; flex-direction: column; gap: 6px; font-size: 11px; font-weight: 600; color: var(--muted); }
.date-fields input[type=date] {
  height: 40px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 8px;
  font-family: inherit; font-size: 13px; color: var(--text); background: #fff; min-width: 180px;
}
.date-fields input[type=date]:focus { outline: none; border-color: var(--green); }
.date-tilde { font-size: 13px; color: var(--muted); padding-bottom: 10px; }
.presets { display: flex; gap: 8px; flex-wrap: wrap; padding-bottom: 4px; }
.preset { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: #fff; font-size: 12px; font-weight: 600; color: var(--muted); }
.preset:hover { border-color: var(--green); color: var(--green); }
.preset.on { background: var(--green); border-color: var(--green); color: #fff; }
.slider { position: relative; height: 32px; }
.slider input[type=range] {
  position: absolute; left: 0; right: 0; width: 100%; top: 8px; margin: 0;
  -webkit-appearance: none; appearance: none; background: none; pointer-events: none; height: 16px;
}
.slider input[type=range]::-webkit-slider-runnable-track { height: 6px; background: transparent; border: none; }
.slider input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; pointer-events: auto;
  width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 2px solid var(--green);
  box-shadow: 0 1px 3px rgba(0,0,0,.15); cursor: grab; margin-top: -6px;
}
.slider input[type=range]::-moz-range-track { height: 6px; background: transparent; border: none; }
.slider input[type=range]::-moz-range-thumb {
  pointer-events: auto; width: 18px; height: 18px; border-radius: 50%;
  background: #fff; border: 2px solid var(--green); box-shadow: 0 1px 3px rgba(0,0,0,.15); cursor: grab;
}
.slider-track { position: absolute; left: 0; right: 0; top: 13px; height: 6px; border-radius: 999px; background: #E8E0D8; }
.slider-fill { position: absolute; top: 0; bottom: 0; background: var(--green); border-radius: 999px; }
.range-ends { display: flex; justify-content: space-between; margin-top: 2px; font-size: 11px; color: var(--faint); }



.kpi-row.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi .v-row { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.kpi .v-row .v { margin-top: 0; }
.delta { font-size: 15px; font-weight: 700; color: var(--green); letter-spacing: -.02em; }
.bar-row.wide { grid-template-columns: 110px 1fr 110px; }
.fill.mute { background: #C8BFB5; }
.chart-link { cursor: pointer; transition: border-color .15s, box-shadow .15s; }
.chart-link:hover { border-color: var(--green-mid); box-shadow: 0 6px 18px rgba(0,122,73,.12); }
.go { color: var(--green); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.profile-view[hidden] { display: none !important; }
.donut-box { min-height: 200px; }
.bars { min-height: 200px; justify-content: center; }
.back { display: inline-flex; align-items: center; gap: 6px; margin-left: 16px; font-size: 12px; font-weight: 600; color: var(--green); }
.back:hover { text-decoration: underline; }
.crumbs-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px 0; font-size: 12px; color: var(--muted); gap: 8px; flex-wrap: wrap; }
.crumbs-row b { color: var(--text); font-weight: 500; }
.hero { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 0; }
.hero .big { font-size: 36px; font-weight: 700; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.hero .big em { font-style: normal; font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.hero .meta { font-size: 13px; color: var(--muted); }
.controls { display: flex; align-items: flex-end; gap: 24px; flex-wrap: wrap; }
.callout {
  position: absolute; z-index: 6; pointer-events: none;
  background: #1C1C1C; color: #fff; border-radius: 8px;
  padding: 10px 14px; transform: translate(-50%, calc(-100% - 12px));
  box-shadow: 0 8px 24px rgba(28,24,20,.2); white-space: nowrap; display: none;
}
.callout.show { display: block; }
.callout:after {
  content: ""; position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%);
  border: 6px solid transparent; border-top-color: #1C1C1C; border-bottom-width: 0;
}

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.6/dist/chart.umd.min.js"></script>
<script>
const fmt = (n, d = 0) => Number(n).toLocaleString("zh-TW", { minimumFractionDigits: d, maximumFractionDigits: d });
const WD = ["日","一","二","三","四","五","六"];
function eachDay(from, to) {
  const out = [];
  for (let d = new Date(from); d <= to; d.setDate(d.getDate() + 1)) out.push(new Date(d));
  return out;
}
const WIN_START = new Date(2025, 8, 1);
const WIN_END = new Date(2026, 7, 31);
const DATES = eachDay(WIN_START, WIN_END);
const N = DATES.length;
function md(d) { return (d.getMonth() + 1) + "/" + d.getDate() + " (" + WD[d.getDay()] + ")"; }
function ymd(d) {
  return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0");
}
function iso(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function parseIso(s) {
  const p = (s || "").split("-").map(Number);
  if (p.length !== 3 || !p[0]) return null;
  return new Date(p[0], p[1] - 1, p[2]);
}
function idxOf(d) {
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  return Math.max(0, Math.min(N - 1, Math.round((t - DATES[0].getTime()) / 86400000)));
}
function synth(n, base, amp, salt) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const wave = 1 + 0.22 * Math.sin(i / 21 + salt);
    const noise = ((Math.sin(i * 12.9898 + salt * 7.3) * 43758.5453) % 1 + 1) % 1;
    out.push(Math.max(8, Math.round(base * wave + (noise - 0.5) * amp)));
  }
  return out;
}
const MAY_BINDS = [44,48,49,38,38,35,33,30,27,24,19,20,24,27,30,36,39,37,36,39,39,41,49,48,35,32,29,27,25,26,28];
const JUN_BINDS = [42,40,36,32,28,37,32,23,27,27,31,35,42,50,44,45,46,47,49,51,51,38,35,34,33,26,30,29,27,31];
const JUL_BINDS = [34,32,30,35,30,30,34,33,38,38,53,56,49,49,47,50,44,48,45,35,34,29,29,27,36,34,29,32,34,37,46];
const AUG_BINDS = [14,18,12,15,16,15,19,13,17,14,13,16,15,20,14,18,13,18,36,45,53,71,89,249,134,116,97,22,18,20,16];
const MAY_FRIENDS = [55,63,64,50,48,43,39,39,47,39,34,38,38,43,45,55,57,51,55,56,56,54,62,62,46,43,40,39,34,45,40];
const JUN_FRIENDS = [56,50,48,47,45,46,48,42,42,44,46,48,64,68,61,59,63,64,58,69,64,49,51,46,45,39,48,48,43,44];
const JUL_FRIENDS = [43,44,44,51,52,47,50,52,56,59,70,70,63,60,58,62,57,64,59,51,47,44,43,44,51,50,49,50,51,53,58];
const AUG_FRIENDS = [20,24,17,21,22,21,26,18,23,19,18,22,21,28,19,25,18,22,50,62,74,99,124,347,186,161,137,48,38,42,32];
const PRE_N = eachDay(WIN_START, new Date(2026, 3, 30)).length;
const METRICS = {
  friends: { name: "好友數", daily: synth(PRE_N, 48, 18, 1.7).concat(MAY_FRIENDS, JUN_FRIENDS, JUL_FRIENDS, AUG_FRIENDS) },
  binds: { name: "綁定會員數", daily: synth(PRE_N, 34, 14, 2.4).concat(MAY_BINDS, JUN_BINDS, JUL_BINDS, AUG_BINDS) }
};
const TODAY = new Date(2026, 7, 27);
const IDX_AUG1 = idxOf(new Date(2026, 7, 1));
const IDX_AUG31 = N - 1;
const state = { metric: "binds", grain: "day", start: IDX_AUG1, end: IDX_AUG31, picked: null, preset: "month" };
let chart;

function sliceOf(arr) { return arr.slice(state.start, state.end + 1); }
function sliceDates() { return DATES.slice(state.start, state.end + 1); }
function buckets() {
  const values = sliceOf(METRICS[state.metric].daily);
  const dates = sliceDates();
  if (state.grain === "day") {
    return { labels: dates.map(md), values: values, dates: dates, raw: values.map((n, i) => ({ label: md(dates[i]), n, start: i, end: i })) };
  }
  if (state.grain === "week") {
    const labels = [], vals = [], items = [];
    for (let i = 0; i < values.length; ) {
      const chunk = values.slice(i, i + 7);
      const a = dates[i], b = dates[i + chunk.length - 1];
      const n = chunk.reduce((s, x) => s + x, 0);
      const label = md(a) + "–" + md(b);
      labels.push(label);
      vals.push(n);
      items.push({ label, n, start: i, end: i + chunk.length - 1 });
      i += 7;
    }
    return { labels, values: vals, dates, raw: items };
  }
  const map = [];
  dates.forEach((d, i) => {
    const key = d.getFullYear() + "-" + d.getMonth();
    let cur = map[map.length - 1];
    if (!cur || cur.key !== key) {
      cur = { key, label: d.getFullYear() + "年" + (d.getMonth() + 1) + "月", n: 0, start: i, end: i };
      map.push(cur);
    }
    cur.n += values[i];
    cur.end = i;
  });
  return { labels: map.map(x => x.label), values: map.map(x => x.n), dates, raw: map };
}

function rangeText() { return md(DATES[state.start]) + "–" + md(DATES[state.end]); }
function syncDateUI() {
  const a = document.getElementById("dateFrom");
  const b = document.getElementById("dateTo");
  a.value = iso(DATES[state.start]);
  b.value = iso(DATES[state.end]);
  document.getElementById("rangeHint").textContent = rangeText();
  document.querySelectorAll("#presets .preset").forEach(p => {
    p.classList.toggle("on", p.dataset.preset === state.preset);
  });
}
function applyRange(start, end, preset) {
  if (start > end) { const t = start; start = end; end = t; }
  state.start = start;
  state.end = end;
  state.preset = preset || "custom";
  state.picked = null;
  hideCallout();
  syncDateUI();
  updateChart();
}
function applyPreset(kind) {
  const end = idxOf(TODAY);
  if (kind === "all") applyRange(0, N - 1, "all");
  else if (kind === "month") applyRange(IDX_AUG1, IDX_AUG31, "month");
  else if (kind === "year") applyRange(idxOf(new Date(2026, 0, 1)), N - 1, "year");
  else if (kind === "7") applyRange(Math.max(0, end - 6), end, "7");
  else if (kind === "30") applyRange(Math.max(0, end - 29), end, "30");
}

const calloutPlugin = {
  id: "pickedLine",
  afterDraw(c) {
    if (state.picked == null) return;
    const meta = c.getDatasetMeta(0);
    const pt = meta.data[state.picked];
    if (!pt) return;
    const ctx = c.ctx, area = c.chartArea;
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = "#007A49";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(pt.x, area.top);
    ctx.lineTo(pt.x, area.bottom);
    ctx.stroke();
    ctx.restore();
  }
};

function hideCallout() {
  document.getElementById("callout").classList.remove("show");
}
function showCallout(index, chartObj) {
  const b = buckets();
  const item = b.raw[index];
  if (!item) return;
  document.getElementById("calloutDate").textContent = item.label;
  document.getElementById("calloutVal").textContent = fmt(item.n) + " 人";
  const el = document.getElementById("callout");
  const meta = chartObj.getDatasetMeta(0);
  const pt = meta.data[index];
  if (!pt) return;
  const wrap = document.getElementById("chartWrap");
  const canvas = chartObj.canvas;
  let left = canvas.offsetLeft + pt.x;
  const top = canvas.offsetTop + pt.y;
  el.classList.add("show");
  const w = el.offsetWidth || 140;
  left = Math.max(w / 2 + 8, Math.min(wrap.clientWidth - w / 2 - 8, left));
  el.style.left = left + "px";
  el.style.top = top + "px";
}

function updateChart() {
  const m = METRICS[state.metric];
  const b = buckets();
  const sum = b.values.reduce((a, x) => a + x, 0);
  document.getElementById("seriesName").textContent = m.name;
  document.getElementById("seriesSum").textContent = fmt(sum);
  document.getElementById("heroNum").innerHTML = fmt(sum) + "<em>人</em>";
  document.getElementById("heroMeta").textContent = m.name + " · 區間新增合計 · " + rangeText();
  syncDateUI();
  if (state.picked != null && state.picked >= b.values.length) state.picked = null;
  const ctx = document.getElementById("growthChart");
  const n = b.values.length;
  const radius = n <= 6 ? 5 : n <= 20 ? 4 : 3;
  const cfg = {
    type: "line",
    data: {
      labels: b.labels,
      datasets: [{
        data: b.values,
        borderColor: "#007A49",
        backgroundColor: (c) => {
          const g = c.chart.ctx, area = c.chart.chartArea;
          if (!area) return "rgba(0,122,73,.15)";
          const gr = g.createLinearGradient(0, area.top, 0, area.bottom);
          gr.addColorStop(0, "rgba(0,122,73,.32)");
          gr.addColorStop(1, "rgba(0,122,73,.02)");
          return gr;
        },
        fill: true, tension: 0.35, borderWidth: 2.2,
        pointRadius: (ctx) => ctx.dataIndex === state.picked ? radius + 3 : radius,
        pointHoverRadius: radius + 3,
        pointBackgroundColor: (ctx) => ctx.dataIndex === state.picked ? "#007A49" : "#fff",
        pointBorderColor: "#007A49",
        pointBorderWidth: 2, pointHoverBackgroundColor: "#007A49"
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      interaction: { mode: "index", intersect: false },
      onClick(evt, els, c) {
        const pts = c.getElementsAtEventForMode(evt, "index", { intersect: false }, true);
        if (!pts.length) return;
        state.picked = pts[0].index;
        c.update();
        showCallout(state.picked, c);
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#1C1C1C",
          titleFont: { family: "Noto Sans TC", size: 12 },
          bodyFont: { family: "Noto Sans TC", size: 13, weight: "600" },
          padding: 10,
          callbacks: { label: (x) => " " + m.name + "  " + fmt(x.raw) + " 人" }
        }
      },
      scales: {
        x: {
          grid: { display: false },
          ticks: {
            font: { family: "Noto Sans TC", size: 10 },
            color: "#6F6A64",
            autoSkip: true,
            maxTicksLimit: state.grain === "day" ? 10 : 12,
            maxRotation: 0
          },
          border: { color: "#E4DBD2" }
        },
        y: {
          beginAtZero: true, grace: "8%",
          ticks: { font: { family: "Noto Sans TC", size: 11 }, color: "#6F6A64", callback: v => fmt(v) },
          grid: { color: "rgba(228,219,210,.9)" }, border: { display: false },
          title: { display: true, text: "人", color: "#6F6A64", font: { family: "Noto Sans TC", size: 11 } }
        }
      }
    },
    plugins: [calloutPlugin]
  };
  if (chart) chart.destroy();
  chart = new Chart(ctx, cfg);
  if (state.picked != null) showCallout(state.picked, chart);
  else hideCallout();
}

function bindDates() {
  const a = document.getElementById("dateFrom");
  const b = document.getElementById("dateTo");
  const onChange = () => {
    const from = parseIso(a.value) || DATES[state.start];
    const to = parseIso(b.value) || DATES[state.end];
    applyRange(idxOf(from), idxOf(to), "custom");
  };
  a.addEventListener("change", onChange);
  b.addEventListener("change", onChange);
  document.querySelectorAll("#presets .preset").forEach(p => {
    p.addEventListener("click", () => applyPreset(p.dataset.preset));
  });
}

function downloadBlob(name, mime, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\uFEFF" + text], { type: mime }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 500);
}
function downloadCsv() {
  const m = METRICS[state.metric];
  const b = buckets();
  const grainLabel = state.grain === "day" ? "日" : state.grain === "week" ? "週" : "月";
  const lines = ["區間," + rangeText(), "指標," + m.name, "粒度," + grainLabel, "", "標籤,人數"];
  b.raw.forEach(item => lines.push(item.label + "," + item.n));
  lines.push("合計," + b.values.reduce((a, x) => a + x, 0));
  downloadBlob("會員成長曲線-" + m.name + ".csv", "text/csv;charset=utf-8", lines.join("\n"));
}
function downloadPng() {
  const canvas = document.getElementById("growthChart");
  const a = document.createElement("a");
  a.href = canvas.toDataURL("image/png");
  a.download = "會員成長曲線-" + METRICS[state.metric].name + ".png";
  a.click();
}
function bindDownloads() {
  document.querySelectorAll(".dd").forEach(dd => {
    const toggle = dd.querySelector(".dd-toggle");
    toggle.addEventListener("click", (e) => {
      e.stopPropagation();
      document.querySelectorAll(".dd.open").forEach(x => { if (x !== dd) x.classList.remove("open"); });
      dd.classList.toggle("open");
    });
    dd.querySelectorAll("[data-dl]").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.dataset.dl === "csv") downloadCsv();
        else downloadPng();
        dd.classList.remove("open");
      });
    });
  });
  document.addEventListener("click", () => document.querySelectorAll(".dd.open").forEach(x => x.classList.remove("open")));
}

document.querySelectorAll("[data-metric]").forEach(btn => {
  btn.addEventListener("click", () => {
    state.metric = btn.dataset.metric;
    state.picked = null;
    document.querySelectorAll("[data-metric]").forEach(b => b.classList.toggle("on", b === btn));
    updateChart();
  });
});
document.querySelectorAll("[data-grain]").forEach(btn => {
  btn.addEventListener("click", () => {
    state.grain = btn.dataset.grain;
    state.picked = null;
    document.querySelectorAll("[data-grain]").forEach(b => b.classList.toggle("on", b === btn));
    updateChart();
  });
});

bindDates();
bindDownloads();
updateChart();

</script>
